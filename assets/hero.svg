<text x="69" y="352" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13"><tspan fill="#84ffd4">$ </tspan><tspan fill="#d7e1f1">python -m curiosity</tspan></text>
<text x="69" y="376" fill="#8497b3" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12">&gt; turning ideas into systems, one iteration at a time</text>
