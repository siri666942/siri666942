<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img">
<title>Siri — BUPT student and AI Agent builder</title>
<desc>A midnight terminal with mint and violet circuitry. Build. Understand. Iterate.</desc>
<defs>
