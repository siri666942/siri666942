  <radialGradient id="glow"><stop stop-color="#56d9c8" stop-opacity=".13"/><stop offset="1" stop-color="#56d9c8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#95b1df" stroke-opacity=".07"/></pattern>
</defs>
