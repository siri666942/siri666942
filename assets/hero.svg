<text x="50" y="258" fill="#e1e9f6" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="500" letter-spacing="1">BUILD. UNDERSTAND. ITERATE.</text>
<text x="50" y="293" fill="#96a7c0" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14">Coding Agents / Retrieval Systems / AI Applications</text>
